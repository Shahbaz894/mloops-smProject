name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  project-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Required for DVC to access git history

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install dvc dvc[gdrive]  # Install DVC with Google Drive support if needed
    
    - name: Configure Git credentials
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Configure DVC remote
      env:
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        dvc remote modify --local origin auth basic
        dvc remote modify --local origin user ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        dvc remote modify --local origin password ${{ secrets.DAGSHUB_PAT }}

    - name: Run DVC pipeline
      env:
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        MLFLOW_TRACKING_URI: https://dagshub.com/Shahbaz894/mloops-smProject.mlflow
      run: |
        dvc pull
        dvc repro -v  # Added -v for verbose output
        dvc push

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v2
      with:
        name: model-artifacts
        path: |
          models/
          reports/
          model_evaluation_errors.log

    - name: Report Pipeline Status
      if: always()
      run: |
        echo "Pipeline Status:"
        dvc status
        if [ -f "model_evaluation_errors.log" ]; then
          echo "Model Evaluation Logs:"
          cat model_evaluation_errors.log
        fi